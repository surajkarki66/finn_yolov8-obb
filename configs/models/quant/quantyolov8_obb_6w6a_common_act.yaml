nc: 16
scale: n  # n | s | m | l | x
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, QuantConv, [64, 3, 2, 6, 6]]
  - [-1, 1, QuantConv, [128, 3, 2, 6, 6]]
  - [-1, 3, QuantC2f, [128, True, 6, 6]]
  - [-1, 1, QuantConv, [256, 3, 2, 6, 6]]
  - [-1, 6, QuantC2f, [256, True, 6, 6]]
  - [-1, 1, QuantConv, [512, 3, 2, 6, 6]]
  - [-1, 6, QuantC2f, [512, True, 6, 6]]
  - [-1, 1, QuantConv, [1024, 3, 2, 6, 6]]
  - [-1, 3, QuantC2f, [1024, True, 6, 6]]
  - [-1, 1, QuantSPPF, [1024, 5, 6, 6]]

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, QuantC2f, [512, False, 6, 6]]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, QuantC2f, [256, False, 6, 6]]
  - [-1, 1, QuantConv, [256, 3, 2, 6, 6]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, QuantC2f, [512, False, 6, 6]]
  - [-1, 1, QuantConv, [512, 3, 2, 6, 6]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, QuantC2f, [1024, False, 6, 6]]
  - [[15, 18, 21], 1, QuantOBB, [nc, 1, 6, 6]]

QuantC2f_common_act: True
common_activations:
  bitwidth: 6
  4: "A"
  6: "B"
  9: "B"
  12: "A"
  16: "A"
  19: "B"
